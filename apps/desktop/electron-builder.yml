appId: co.lazycoders.clipply
productName: Clipply
electronVersion: 45.4.1
directories:
  output: dist
  buildResources: resources
# Everything is bundled into out/ by electron-vite; no node_modules ship.
files:
  - out/**
  - resources/icon.png
  - package.json
linux:
  target: [AppImage, deb]
  category: Utility
  icon: resources/icon.png
  executableName: clipply
  syncDesktopName: true
  maintainer: Clipply <clipply@users.noreply.github.com>
  synopsis: End-to-end encrypted clipboard history
deb:
  packageName: clipply
  artifactName: clipply_${version}_${arch}.deb
  depends: [libgtk-3-0, libnss3, libxss1, libxtst6, libnotify4, libsecret-1-0, x11-utils]
  recommends: [libappindicator3-1]
appImage:
  artifactName: ${productName}-${version}-${arch}.AppImage
# Writes latest-linux.yml for electron-updater. Uploading is done by scripts/release.mjs, never by
# electron-builder itself (it runs with --publish never and without a token).
publish:
  provider: github
  owner: Sharif-Minhaz
  repo: clipply
  releaseType: release
